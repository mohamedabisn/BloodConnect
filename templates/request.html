{% extends "base.html" %}{% block content %}<div class="auth wideauth"><span class="eyebrow">BLOOD REQUEST</span><h1>Request Blood</h1><p>AI-style priority detection marks urgent requests based on the details you provide.</p><form method="post"><div class="two"><label>Blood Group<select name="blood_group">{% for x in ['A+','A-','B+','B-','O+','O-','AB+','AB-'] %}<option>{{x}}</option>{% endfor %}</select></label><label>Units<input name="units" type="number" min="1" value="1"></label></div><div class="two"><label>District<input name="district" value="Tiruchirappalli"></label><label>Area<input name="area" required></label></div><label>Hospital<input name="hospital" required placeholder="Hospital / blood bank name"></label><label>Details<textarea name="details" rows="5" placeholder="Example: Urgent surgery today, need O+ blood..."></textarea></label><button class="btn">Post Blood Request →</button></form></div>{% endblock %}
