{% extends "base.html" %}{% block content %}<div class="auth wideauth"><span class="eyebrow">BECOME A DONOR</span><h1>Join BloodConnect</h1><p>Register your details so people searching in your area can find a potential donor.</p><form method="post"><div class="two"><label>Name<input name="name" required></label><label>Phone<input name="phone" required></label></div><label>Email<input name="email" type="email" required></label><label>Password<input name="password" type="password" minlength="6" required></label><div class="two"><label>Blood Group<select name="blood_group" required><option>A+</option><option>A-</option><option>B+</option><option>B-</option><option>O+</option><option>O-</option><option>AB+</option><option>AB-</option></select></label><label>District<input name="district" value="Tiruchirappalli" required></label></div><div class="two"><label>Area / Locality<input name="area" placeholder="Srirangam / Thillai Nagar..." required></label><label>Availability<select name="available"><option value="1">Available</option></select></label></div><button class="btn">Create Donor Account →</button></form></div>{% endblock %}
